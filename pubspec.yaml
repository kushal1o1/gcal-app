name: gcal_app
description: "Voice reminders for your Google Calendar. Tap the mic, speak, done."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  speech_to_text: ^7.5.0
  http: ^1.6.0
  home_widget: ^0.10.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
