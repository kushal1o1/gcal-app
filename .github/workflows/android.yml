name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed only to attach APKs to a GitHub Release on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # One APK per CPU type (arm64 covers almost all current phones).
      - run: flutter build apk --release --split-per-abi

      # Stable names (gcal-arm64-v8a.apk, ...) so the landing page's
      # releases/latest/download links never change between versions.
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            name=${f#app-}
            name=${name%-release.apk}
            mv "$f" "gcal-${name}.apk"
          done
          ls -l gcal-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gcal-android-apks
          path: build/app/outputs/flutter-apk/gcal-*.apk
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gcal-android-apks
          path: apks

      - uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
